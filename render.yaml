services:
  - type: web
    name: term-craft
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://usetermcraft.com
      - key: DATA_DIR
        value: /var/data
