services:
  - type: web
    name: term-craft
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://usetermcraft.com
      - key: DATA_DIR
        value: /var/data
    disk:
      name: lead-data
      mountPath: /var/data
      sizeGB: 1
